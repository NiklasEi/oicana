name: publish ruby

# Builds the platform gems of the Ruby integration from the oicana_uniffi-v<version> release and
# publishes them. The native release workflow dispatches this flow once the release exists.
#
# Publishing uses RubyGems trusted publishing (OIDC).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0-rc.1)'
        type: string
        required: true

permissions:
  contents: read

jobs:
  package-gems:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Determine and validate version
        run: |
          VERSION="${{ inputs.version }}"
          GEM_VERSION=$(sed -n 's/^  VERSION = "\(.*\)"/\1/p' integrations/ruby/lib/oicana/version.rb)
          # RubyGems separates prereleases with a dot: 0.1.0-rc.1 is 0.1.0.rc.1
          if [[ "$GEM_VERSION" != "${VERSION//-/.}" ]]; then
            echo "::error::lib/oicana/version.rb has version $GEM_VERSION, expected ${VERSION//-/.}"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "GEM_VERSION=${GEM_VERSION}" >> "$GITHUB_ENV"

      - name: Download the native libraries
        run: |
          gh release download "oicana_uniffi-v$VERSION" --repo "${{ github.repository }}" --dir natives \
            --pattern 'oicana_uniffi-*' --pattern SHA256SUMS
          cd natives && sha256sum --check SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: '3.4'

      - name: Build the platform gems
        working-directory: integrations/ruby
        run: |
          shopt -s nullglob
          declare -A platforms=(
            [x86_64-unknown-linux-gnu]=x86_64-linux-gnu
            [aarch64-unknown-linux-gnu]=aarch64-linux-gnu
            [x86_64-unknown-linux-musl]=x86_64-linux-musl
            [aarch64-unknown-linux-musl]=aarch64-linux-musl
            [x86_64-apple-darwin]=x86_64-darwin
            [aarch64-apple-darwin]=arm64-darwin
            [x86_64-pc-windows-msvc]=x64-mingw-ucrt
            [aarch64-pc-windows-msvc]=aarch64-mingw-ucrt
          )
          mkdir ../../gems
          for target in "${!platforms[@]}"; do
            rm -rf lib/oicana/native
            mkdir -p lib/oicana/native
            libraries=()
            for extension in so dylib dll; do
              candidate="../../natives/oicana_uniffi-$VERSION-$target.$extension.gz"
              if [ -f "$candidate" ]; then libraries+=("$candidate"); fi
            done
            if [ "${#libraries[@]}" -ne 1 ]; then
              echo "::error::Expected one shared library for $target, found ${#libraries[@]}"
              exit 1
            fi
            case "${libraries[0]}" in
              *.dll.gz) library=oicana_uniffi.dll ;;
              *.dylib.gz) library=liboicana_uniffi.dylib ;;
              *) library=liboicana_uniffi.so ;;
            esac
            gunzip -c "${libraries[0]}" > "lib/oicana/native/$library"
            OICANA_PLATFORM="${platforms[$target]}" gem build oicana.gemspec --output "../../gems/oicana-$GEM_VERSION-${platforms[$target]}.gem"
          done
          rm -rf lib/oicana/native
          gem build oicana.gemspec --output "../../gems/oicana-$GEM_VERSION.gem"

      - name: Report gem sizes
        run: |
          echo "| Gem | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for gem in gems/*.gem; do
            echo "| $(basename "$gem") | $(du -h "$gem" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: oicana-ruby-gems
          path: gems/*.gem

      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push gems to rubygems.org
        run: |
          # A re-run after a partial failure skips the gems that are already published
          for gem in gems/*.gem; do
            if ! output=$(gem push "$gem" 2>&1); then
              if [[ "$output" != *"Repushing of gem versions is not allowed"* ]]; then
                echo "$output"
                exit 1
              fi
            fi
            echo "$output"
          done
