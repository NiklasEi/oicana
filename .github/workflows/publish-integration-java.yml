name: publish java

# This workflow builds and publishes the Java integration
#
# It requires the secrets OSSRH_USERNAME, OSSRH_PASSWORD, and GPG_SIGNING_KEY

on:
  workflow_dispatch:
  push:
    tags:
      - 'oicana_java-v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

env:
  LIB_NAME: oicana_java_native

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Build release
        run: cargo build --release -p ${{ env.LIB_NAME }}
      - uses: actions/upload-artifact@v4
        with:
          name: oicana-java-linux-x86_64
          path: target/release/lib${{ env.LIB_NAME }}.so

  build-linux-aarch64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu
      - name: Install cross-compilation tools
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build release
        run: cargo build --release -p ${{ env.LIB_NAME }} --target=aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - uses: actions/upload-artifact@v4
        with:
          name: oicana-java-linux-aarch64
          path: target/aarch64-unknown-linux-gnu/release/lib${{ env.LIB_NAME }}.so

  build-macos-x86_64:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-apple-darwin
      - name: Build release
        run: cargo build --release -p ${{ env.LIB_NAME }} --target=x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: oicana-java-macos-x86_64
          path: target/x86_64-apple-darwin/release/lib${{ env.LIB_NAME }}.dylib

  build-macos-aarch64:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - name: Build release
        run: cargo build --release -p ${{ env.LIB_NAME }} --target=aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: oicana-java-macos-aarch64
          path: target/aarch64-apple-darwin/release/lib${{ env.LIB_NAME }}.dylib

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Build release
        run: cargo build --release -p ${{ env.LIB_NAME }}
      - uses: actions/upload-artifact@v4
        with:
          name: oicana-java-windows-x86_64
          path: target/release/${{ env.LIB_NAME }}.dll

  package-and-publish:
    runs-on: ubuntu-latest
    needs: [build-linux-x86_64, build-linux-aarch64, build-macos-x86_64, build-macos-aarch64, build-windows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Download native libraries into the resource directory structure
      - uses: actions/download-artifact@v4
        with:
          name: oicana-java-linux-x86_64
          path: integrations/java/oicana/src/main/resources/natives/linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: oicana-java-linux-aarch64
          path: integrations/java/oicana/src/main/resources/natives/linux-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: oicana-java-macos-x86_64
          path: integrations/java/oicana/src/main/resources/natives/macos-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: oicana-java-macos-aarch64
          path: integrations/java/oicana/src/main/resources/natives/macos-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: oicana-java-windows-x86_64
          path: integrations/java/oicana/src/main/resources/natives/windows-x86_64

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        working-directory: integrations/java/oicana
        run: ./gradlew build

      - name: Publish to Maven Central
        working-directory: integrations/java/oicana
        run: ./gradlew publish
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
