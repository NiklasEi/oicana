name: Trigger Composer Repository Update

on:
  push:
    tags:
      - 'oicana_php-v*'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Satis repository rebuild
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/oicana/composer/dispatches \
            -d '{"event_type":"php-release"}'
