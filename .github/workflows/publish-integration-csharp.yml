name: publish csharp

# This workflow builds and publishes the C# integration
# 
# It requires the secret NUGET_TOKEN with rights to push to the nuget.org package 

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0-rc.1)'
        type: string
        required: true
  push:
    tags:
      - 'oicana_csharp-v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

env:
  LIB_NAME: oicana_csharp

jobs:
  validate-version:
    name: Validate version consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v6

      - name: Determine and validate version
        id: version
        run: |
          if [[ "${{ github.ref_name }}" == oicana_csharp-v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#oicana_csharp-v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            echo "::error::Version must be provided via tag or workflow input"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Publishing version: ${VERSION}"

          ERRORS=()

          CARGO_VERSION=$(grep '^version = ' integrations/csharp/oicana_csharp/Cargo.toml | head -n1 | sed 's/version = "\(.*\)"/\1/')
          if [[ "$CARGO_VERSION" != "$VERSION" ]]; then
            ERRORS+=("oicana_csharp/Cargo.toml has version $CARGO_VERSION")
          fi

          CSPROJ_VERSION=$(grep -oP '(?<=<Version>)[^<]+' integrations/csharp/Oicana/Oicana.csproj | head -n1)
          if [[ "$CSPROJ_VERSION" != "$VERSION" ]]; then
            ERRORS+=("Oicana.csproj has version $CSPROJ_VERSION")
          fi

          if [[ ${#ERRORS[@]} -gt 0 ]]; then
            echo "::error::Version mismatch for ${VERSION}:"
            for err in "${ERRORS[@]}"; do
              echo "::error::  - $err"
            done
            exit 1
          fi

          echo "All version sources match: ${VERSION}"

  build-linux:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Build release
        run: cargo build --release -p ${{ env.LIB_NAME }}
      - uses: actions/upload-artifact@v7
        with:
          name: oicana-csharp-linux
          path: target/release/lib${{ env.LIB_NAME }}.so
  build-windows:
    needs: validate-version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Build release
        run: cargo build --release -p ${{ env.LIB_NAME }}
      - uses: actions/upload-artifact@v7
        with:
          name: oicana-csharp-windows
          path: target/release/${{ env.LIB_NAME }}.dll
  build-mac-x86:
    needs: validate-version
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-apple-darwin
      - name: Build release
        run: cargo build --release -p ${{ env.LIB_NAME }} --target=x86_64-apple-darwin
      - uses: actions/upload-artifact@v7
        with:
          name: oicana-csharp-macos-x86
          path: target/x86_64-apple-darwin/release/lib${{ env.LIB_NAME }}.dylib
  build-mac-arm:
    needs: validate-version
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - name: Build release
        run: cargo build --release -p ${{ env.LIB_NAME }} --target=aarch64-apple-darwin
      - uses: actions/upload-artifact@v7
        with:
          name: oicana-csharp-macos-arm
          path: target/aarch64-apple-darwin/release/lib${{ env.LIB_NAME }}.dylib
  package-nuget:
    runs-on: ubuntu-latest
    needs: [validate-version, build-linux, build-windows, build-mac-x86, build-mac-arm]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: oicana-csharp-linux
          path: integrations/csharp/Oicana/runtimes/linux-x64/native
      - uses: actions/download-artifact@v8
        with:
          name: oicana-csharp-windows
          path: integrations/csharp/Oicana/runtimes/win-x64/native
      - uses: actions/download-artifact@v8
        with:
          name: oicana-csharp-macos-x86
          path: integrations/csharp/Oicana/runtimes/osx-x64/native
      - uses: actions/download-artifact@v8
        with:
          name: oicana-csharp-macos-arm
          path: integrations/csharp/Oicana/runtimes/osx-arm64/native
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8'
      - name: Build release
        run: dotnet build integrations/csharp/Oicana --configuration Release
      - name: Pack release
        run: dotnet pack integrations/csharp/Oicana
      - uses: actions/upload-artifact@v7
        with:
          name: oicana-csharp-nuget
          path: integrations/csharp/Oicana/bin/Release/Oicana.*.nupkg
      - name: push package to nuget.org
        run: dotnet nuget push integrations/csharp/Oicana/bin/Release/Oicana.*.nupkg -s nuget.org -k $NUGET_TOKEN
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
