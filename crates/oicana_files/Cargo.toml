[package]
name = "oicana_files"
description = "File abstractions for Typst templates."
keywords = { workspace = true }
categories = { workspace = true }
version = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license-file = { workspace = true }
readme = { workspace = true }

[features]
default = ["packed", "preloaded"]
packed = ["dep:zip"]
preloaded = []
native = ["dep:typst-kit", "dep:termcolor", "dep:dirs", "dep:codespan-reporting"]

[dependencies]
typst = { workspace = true }
typst-kit = { workspace = true, optional = true, features = ["system-packages", "system-downloader"] }
typst-utils = { workspace = true }

zip = { workspace = true, default-features = false, features = ["zstd"], optional = true }
thiserror = { workspace = true }

dirs = { workspace = true, optional = true }
codespan-reporting = { workspace = true, optional = true }
termcolor = { workspace = true, optional = true }
log = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
