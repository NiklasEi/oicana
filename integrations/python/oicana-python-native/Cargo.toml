[package]
name = "oicana-python-native"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license-file = "LICENSE.md"
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
name = "oicana_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.1", features = ["extension-module", "abi3-py38", "hashbrown"] }
uuid = { workspace = true, features = ["v4"] }
dashmap = { workspace = true }
once_cell = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }

# Oicana workspace crates
oicana_world = { workspace = true }
oicana_files = { workspace = true, features = ["packed"] }
oicana_input = { workspace = true }
oicana_template = { workspace = true }
oicana_export = { workspace = true, features = ["pdf", "png", "svg"] }
typst = { workspace = true }

[build-dependencies]
pyo3-build-config = "0.23"
